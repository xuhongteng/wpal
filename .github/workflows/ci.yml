name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    # 统一用 bash：Windows 上的 PowerShell 会把 -coverprofile=coverage.out
    # 拆成两个参数，导致 go test 把 .out 当成包名。
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # 固定版本：本地验证过的是 v1.62.2，与 .golangci.yml 的 v1 配置格式一致
          version: v1.62.2
          args: --timeout=5m
      - name: actionlint (workflow schema)
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: .github/workflows/*.yml

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -coverprofile=coverage.out ./...
      - name: go test (race, linux only)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...
      - name: upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # GitHub Actions 表达式不支持 matrix.x.split('/')[0] 这类方法调用，
        # 因此显式列出每个目标平台。
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: "386" }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" -o dist/wpal ./cmd/wpal
      - name: Check size budget
        run: |
          size=$(stat -c%s dist/wpal 2>/dev/null || stat -f%z dist/wpal)
          limit=$((12 * 1024 * 1024))
          echo "binary size: $size bytes (limit $limit)"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::binary exceeds the 12 MB size budget"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: wpal-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/wpal

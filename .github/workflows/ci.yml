name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -coverprofile=coverage.out ./...
      - name: upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build ${{ matrix.target }}
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - linux/386
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.target.split('/')[0] }}
          GOARCH: ${{ matrix.target.split('/')[1] }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" -o dist/wpal ./cmd/wpal
      - name: Check size budget
        run: |
          size=$(stat -c%s dist/wpal 2>/dev/null || stat -f%z dist/wpal)
          limit=$((12 * 1024 * 1024))
          echo "binary size: $size bytes (limit $limit)"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::binary exceeds the 12 MB size budget"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wpal-${{ matrix.target }}
          path: dist/wpal

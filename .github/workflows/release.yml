name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    name: Build and publish packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache: true

      # SBOM 需要 syft（goreleaser 的 sbom 步骤依赖它）
      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.55.0

      # download-syft 只把 syft 的路径放进 outputs.cmd，
      # 不会自动加进 PATH，goreleaser 找不到它就会报 "could not catalog artifact"。
      - name: Add syft to PATH
        run: |
          SYFT_BIN="${{ steps.syft.outputs.cmd }}"
          if [ -x "$SYFT_BIN" ]; then
            echo "$(dirname "$SYFT_BIN")" >> "$GITHUB_PATH"
            echo "syft 已就绪: $SYFT_BIN"
          else
            echo "::warning::syft 未就绪，SBOM 生成可能被跳过"
          fi

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Publish container image
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/xuhongteng/wpal
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

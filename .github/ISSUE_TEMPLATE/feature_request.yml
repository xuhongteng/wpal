name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: The feature keeps Wpal lightweight (binary size / memory)
          required: true
        - label: The feature works on Linux, macOS and Windows

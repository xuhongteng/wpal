run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gosimple
    - gocritic
    - misspell
    - revive
    - bodyclose
    - unconvert
    - prealloc

linters-settings:
  gocritic:
    enabled-tags:
      - diagnostic
      - style
    disabled-checks:
      # 以下检查属于纯风格偏好，与本项目写法不符，统一关闭。
      - ifElseChain
      - unnamedResult
      - tooManyResultsChecker
      - paramTypeCombine
      - unlambda
      - evalOrder
  revive:
    rules:
      - name: exported
        arguments:
          - disableStutteringCheck
  misspell:
    locale: US

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gocritic
  max-issues-per-linter: 0
  max-same-issues: 0
